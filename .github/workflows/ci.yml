name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check-license:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  build-test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.20.4"
            otp: "29.1"
            checks: true
          - elixir: "1.19.6"
            otp: "28.5.0.6"
          - elixir: "1.18.5"
            otp: "27.3.4.17"
          - elixir: "1.17.3"
            otp: "27.3.4.16"
          - elixir: "1.16.3"
            otp: "26.2.5"
          - elixir: "1.15.7"
            otp: "26.2.1"
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmnl-dev libnl-genl-3-dev dnsmasq-base
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          version-type: strict
      - uses: actions/cache@v6
        with:
          path: |
            _build
            deps
          key: v1-mix-cache-ubuntu-24.04-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix test
      - if: matrix.checks
        run: mix format --check-formatted
      - if: matrix.checks
        run: mix deps.unlock --check-unused
      - if: matrix.checks
        run: mix compile --warnings-as-errors
      - if: matrix.checks
        run: mix docs
      - if: matrix.checks
        run: mix hex.build
      - if: matrix.checks
        run: mix credo -a --strict
      - if: matrix.checks
        run: mix dialyzer

  network-test:
    name: DHCP and IPv6 packet tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LC_ALL: C.UTF-8
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libmnl-dev libnl-genl-3-dev dnsmasq-base iproute2 python3 nftables
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.4"
          otp-version: "29.1"
          version-type: strict
      - uses: actions/cache/restore@v6
        with:
          path: |
            _build
            deps
          key: v1-mix-cache-ubuntu-24.04-1.20.4-29.1-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - name: Test DHCP and router advertisements in isolated namespaces
        run: |
          set -o pipefail
          sudo -n env "PATH=$PATH" "MIX_HOME=$HOME/.mix" "HEX_HOME=$HOME/.hex" MIX_ENV=test DNSMASQEX_NETWORK_TESTS=1 \
            unshare --net mix test test/dnsmasqex/network_integration_test.exs --no-compile --no-deps-check --trace 2>&1 | tee network-tests.log
      - name: Save protocol test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-test-output
          path: network-tests.log
